<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndiaMART Lead Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0d0d1a;
      color: #e0e0f0;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #c0c0e0;
      line-height: 1.2;
    }

    header span {
      font-size: 10px;
      color: #6677aa;
    }

    .card {
      background: #13132a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .label {
      font-size: 11px;
      color: #6677aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s ease;
    }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .status-dot.offline { background: #ef4444; }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      transition: color 0.3s ease;
    }
    .status-text.online  { color: #22c55e; }
    .status-text.offline { color: #ef4444; }

    .port-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }

    .port-row label {
      font-size: 11px;
      color: #6677aa;
      white-space: nowrap;
    }

    .port-row input {
      width: 70px;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #c0d0ff;
      font-size: 12px;
      padding: 3px 7px;
      font-family: "Consolas", monospace;
    }

    .port-row input:focus {
      outline: none;
      border-color: #4facfe;
    }

    button#save-port {
      padding: 4px 10px;
      border-radius: 6px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      color: #0d0d1a;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button#save-port:hover { opacity: 0.85; }

    /* ── Play/Pause toggle ──────────────────────────────────────────────── */
    .toggle-card {
      background: #13132a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-label-group .label { margin-bottom: 0; }

    .toggle-label-group .toggle-sub {
      font-size: 10px;
      color: #44446a;
    }

    #bot-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.25s, box-shadow 0.25s, transform 0.1s;
      user-select: none;
    }
    #bot-toggle:active { transform: scale(0.96); }

    /* RUNNING state — green */
    #bot-toggle.running {
      background: linear-gradient(135deg, #14532d, #16a34a);
      color: #d1fae5;
      box-shadow: 0 0 10px #16a34a55;
    }
    #bot-toggle.running:hover { box-shadow: 0 0 16px #22c55e88; }

    /* PAUSED state — amber */
    #bot-toggle.paused {
      background: linear-gradient(135deg, #78350f, #d97706);
      color: #fef3c7;
      box-shadow: 0 0 10px #d9770644;
    }
    #bot-toggle.paused:hover { box-shadow: 0 0 16px #f59e0b88; }

    .events-list {
      font-size: 10px;
      color: #555;
      max-height: 80px;
      overflow-y: auto;
    }

    .event-item {
      padding: 2px 0;
      border-bottom: 1px solid #1a1a2e;
      color: #7788bb;
    }

    .event-item:last-child { border-bottom: none; }

    .footer {
      font-size: 9px;
      color: #3a3a5a;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🔌</div>
  <div>
    <h1>IndiaMART Lead Bridge</h1>
    <span>Localhost Extension v3.0</span>
  </div>
</header>

<!-- Play / Pause toggle card -->
<div class="toggle-card">
  <div class="toggle-label-group">
    <span class="label">Bot Status</span>
    <span class="toggle-sub" id="toggle-sub">Monitoring leads…</span>
  </div>
  <button id="bot-toggle" class="running" title="Toggle bot on/off">
    <span id="toggle-icon">▶</span>
    <span id="toggle-label">Running</span>
  </button>
</div>

<!-- Status card -->
<div class="card">
  <div class="row">
    <span class="label">Bot Connection</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Checking...</span>
    </div>
  </div>

  <div class="port-row">
    <label for="port-input">Port:</label>
    <input type="number" id="port-input" min="1" max="65535" placeholder="9223" />
    <button id="save-port">Save</button>
  </div>
</div>

<!-- Recent events card -->
<div class="card">
  <div class="row" style="margin-bottom:8px;">
    <span class="label">Recent Signals</span>
    <span id="signal-count" style="font-size:11px;color:#4facfe;">0 sent</span>
  </div>
  <div class="events-list" id="events-list">
    <div class="event-item" style="color:#3a3a5a;font-style:italic;">No signals yet…</div>
  </div>
</div>

<div class="footer">All traffic goes to 127.0.0.1 only — zero external calls.</div>

<script src="popup.js"></script>
</body>
</html>
